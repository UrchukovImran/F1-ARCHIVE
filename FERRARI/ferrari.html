<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scaleable=1, maximum-scale=2.0, minimum-scale=1.0, viewport-fit=auto">
    <title>Scuderia Ferrari</title>
    <link rel="stylesheet" href="STYLES/ferrari.css">
    <link rel="stylesheet" href="/FERRARI/STYLES/adaptive.css">
    <link rel="stylesheet" href="STYLES/drivers.css">
    <link rel="stylesheet" href="STYLES/the-car.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Basic&family=Birthstone&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Oswald:wght@200..700&family=Playwrite+DE+SAS+Guides&family=Prociono&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header style="position: fixed;">
        <div class="top-bar">
            <div class="ferrari">Ferrari</div>
            <div class="ferrari-logo"><img src="FERRARI-MEDIA/LOGO/LOGO-FERRARI.png"></div>
        </div>
        <div class="top-bar-line"></div>

    </header>
    <div id="container">
        <main>
            <div class="car-perfomance">
                <div class="car-name">SF-26</div>
                <div class="car-img"><img src="FERRARI-MEDIA/THE-CAR/SF-26-RIGHT.avif"></div>
                <div class="line-anim"></div>
            </div>
            <div class="car-info-block">
                <div class="about-text">ABOUT <span class="adap">SF-26</span>
                    <div class="about-text-line"></div>
                </div>
                <div class="of-on-but"><button>ON/OFF</button></div>
                <div class="car-above">
                    <img src="FERRARI-MEDIA/THE-CAR/SF-26-ABOVE.avif">

                    <div class="front-wing"></div>
                    <div class="front-wing-line">Active Aero Front Wing</div>

                    <div class="left-front-tire"></div>
                    <div class="left-front-tire-line">Left Front Tire</div>

                    <div class="right-front-tire"></div>
                    <div class="right-front-tire-line">Right Front Tire</div>

                    <div class="left-rear-tire"></div>
                    <div class="left-rear-tire-line">Left Rear Tire</div>

                    <div class="right-rear-tire"></div>
                    <div class="right-rear-tire-line">Right Rear Tire</div>

                    <div class="halo">
                        <div class="halo-1"></div>
                        <div class="halo-2"></div>
                        <div class="halo-3"></div>
                        <div class="halo-4"></div>
                        <div class="halo-5"></div>
                        <div class="halo-6"></div>
                        <div class="halo-7"></div>
                        <div class="halo-8"></div>
                    </div>
                    <div class="halo-line">Halo</div>

                    <div class="cockpit"></div>
                    <div class="cockpit-line">Cockpit</div>

                    <div class="rear-wing"></div>
                    <div class="rear-wing-line">Active Aero Rear Wing</div>

                    <div class="car-line"></div>
                </div>

            </div>
            <div class="drivers-block">
                <div class="drivers-text">DRIVERS<div class="drivers-text-line"></div>
                </div>
                <div class="drivers">
                    <div class="leclerc">
                        <div class="drivers-img">
                            <img src="FERRARI-MEDIA/DRIVERS/LEC.avif">
                            <div class="driver-name">Charles</div>
                            <div class="driver-lastname">LECLERC</div>
                        </div>
                        <div class="flag">
                            <img src="/FERRARI/FERRARI-MEDIA/FLAGS/MONACO-FLAG.png" alt="flag-of-MONACO">
                        </div>
                        <div class="num">
                            <img src="/FERRARI/FERRARI-MEDIA/NUMBERS/16-FERRARI.png" alt="CL-NUMBER-16">
                        </div>
                        <div class="lec-background">
                            <div class="lec-1">LEC</div>
                            <div class="lec-2">LEC</div>
                            <div class="lec-3">LEC</div>
                            <div class="lec-4">LEC</div>
                        </div>
                    </div>
                    <div class="hamilton">
                        <div class="drivers-img">
                            <img src="FERRARI-MEDIA/DRIVERS/HAM.avif">
                            <div class="driver-name">Lewis</div>
                            <div class="driver-lastname">HAMILTON</div>
                        </div>
                        <div class="flag">
                            <img src="/FERRARI/FERRARI-MEDIA/FLAGS/UK-FLAG.png" alt="flag-of-UK">
                        </div>
                        <div class="num">
                            <img src="/FERRARI/FERRARI-MEDIA/NUMBERS/44-FERRARI.png" alt="LH-NUMBER-44">
                        </div>
                        <div class="ham-background">
                            <div class="ham-1">HAM</div>
                            <div class="ham-2">HAM</div>
                            <div class="ham-3">HAM</div>
                            <div class="ham-4">HAM</div>
                        </div>
                    </div>
                </div>
                <div class="driver-line"></div>
            </div>
            <div class="home-but">
                <button onclick="window.location.href='../MAIN PAGE/index.html'">HOME</button>
            </div>
    </div>
    </main>
    </div>

    <script>
        // Toggle all lines visibility and hover effect
        const button = document.querySelector('.of-on-but button');
        const carAbove = document.querySelector('.car-above');

        button.addEventListener('click', function () {
            carAbove.classList.toggle('lines-visible');
        });
    </script>
</body>

</html>
